services:
  # ---------------------------------------------------------------------------
  # API — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: auri-api:latest
    container_name: auri-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-auri}:${DB_PASSWORD:-auri}@db:5432/${DB_NAME:-auri}
      # Container-network hostname, not the host-facing localhost default in .env —
      # otherwise the admin dashboard's LiveKit status probe always reports unreachable.
      - LIVEKIT_URL=ws://livekit:7880
      # Same class of fix: Ollama runs on the *host*, so the .env default of
      # localhost:11434 resolves to the container itself and fails with
      # "[Errno 99] Cannot assign requested address". Every LLM call then
      # falls through the chain to Gemini/OpenAI, and with no keys configured
      # the whole chain fails — which silently costs the confession its
      # summary and category, and makes moderation fail closed so everything
      # lands in the review queue.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      # Docker Desktop provides host.docker.internal; native Linux does not.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - auri-net
    volumes:
      - ./.cache:/app/.cache:rw
      - ./data:/app/data:rw
    healthcheck:
      # Probed with python, which the image already has. The previous `curl`
      # probe is not installed in python:3.11-slim, so every check failed
      # with "executable file not found" and the container sat permanently
      # unhealthy while serving traffic fine.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Bot — Telegram delivery agent
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: auri-bot:latest
    container_name: auri-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - auri-net

  # ---------------------------------------------------------------------------
  # DB — PostgreSQL (pgcrypto installed; no column is encrypted with it)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: auri-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-auri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auri}
      POSTGRES_DB: ${DB_NAME:-auri}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - auri-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auri}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NATS — inter-service messaging
  # ---------------------------------------------------------------------------
  nats:
    image: nats:latest
    container_name: auri-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    networks:
      - auri-net

  # ---------------------------------------------------------------------------
  # Ollama — local LLM (optional)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: auri-ollama
    restart: unless-stopped
    profiles:
      - optional
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - auri-net

  # ---------------------------------------------------------------------------
  # LiveKit — self-hosted real-time voice SFU (Phase 7, local dev only)
  # ---------------------------------------------------------------------------
  # --dev mode hardcodes API key/secret to devkey/secret (no cloud account
  # needed). --bind 0.0.0.0 makes the signal server reachable from a real
  # device on the same LAN (dev machine's LAN IP, not localhost). Media
  # (RTC/UDP) is only reachable on the LAN — do not tunnel this through ngrok.
  livekit:
    image: livekit/livekit-server:latest
    container_name: auri-livekit
    restart: unless-stopped
    profiles:
      - optional
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880" # signal (HTTP/WS)
      - "7881:7881" # RTC/TCP fallback
      - "7882:7882/udp" # RTC/UDP mux
    networks:
      - auri-net

  # ---------------------------------------------------------------------------
  # Agent — LiveKit Agents Python worker (Phase 7/10.7, local dev only)
  # ---------------------------------------------------------------------------
  # Connectivity wiring only (task 10.7) — joins a room and confirms it can
  # authenticate against the self-hosted `livekit` service above. The full
  # STT/LLM/TTS booth conversation is task 7.3.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: auri-agent:latest
    container_name: auri-agent
    restart: unless-stopped
    profiles:
      - optional
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-auri}:${DB_PASSWORD:-auri}@db:5432/${DB_NAME:-auri}
      # Container-network hostname, not the host-facing localhost default in .env.
      - LIVEKIT_URL=ws://livekit:7880
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - auri-net

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  auri-net:
    name: auri-net
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
    name: auri-pgdata
  ollama-models:
    name: auri-ollama-models
