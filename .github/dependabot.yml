# Dependency update pull requests (plan 15.3). Weekly and grouped, so a week's
# updates arrive as one PR per ecosystem and directory rather than dozens. CI
# (including the audits and Trivy) judges each one; nothing merges on its own.
#
# Python: requirements.txt holds lower bounds and backend/constraints.txt the
# tested versions (15.1). Dependabot bumps each package on its own, without a
# resolver run across the whole set, so its pip PRs pinned versions that cannot
# install together (livekit-agents caps openai, numpy and others) and raised
# lower bounds to the newest release. Pip version updates are therefore off
# (open-pull-requests-limit: 0); security updates still open PRs. Upgrades go
# through the constraints regeneration its header describes, with the weekly
# "Latest dependencies" workflow as the early warning.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-backend:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /bot
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-bot:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Node types follow the runtime in .nvmrc (22); a newer major would type
      # APIs that Node 22 does not have. Bump them with .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo pins matching versions of React, React Native and its own modules for
      # each SDK; those move together in an SDK upgrade (task 15.13), not one by one.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Majors elsewhere (@react-three/fiber 9, drei 10, typescript-eslint 8) need
      # React 19 or config migrations that ride along with the SDK upgrade.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # three is still 0.x, so a minor release can break the scene, which only a
      # device can check (17.6); it moves with @react-three/* in 15.13.
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker
    directories: ["/", "/bot"]
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
