# Dependency update pull requests (plan 15.3). Weekly and grouped, so a week's
# updates arrive as one PR per ecosystem and directory rather than dozens. CI
# (including the audits and Trivy) judges each one; nothing merges on its own.
#
# Python: requirements.txt holds lower bounds and backend/constraints.txt the
# tested versions (15.1). A Dependabot pip PR bumps what it finds; regenerate the
# constraints file as its header describes before merging one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-backend:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /bot
    schedule:
      interval: weekly
    groups:
      python-bot:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo pins matching versions of React, React Native and its own modules for
      # each SDK; those move together in an SDK upgrade (task 15.13), not one by one.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directories: ["/", "/bot"]
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
