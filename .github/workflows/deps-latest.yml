name: Latest dependencies

# CI and the Docker images install the versions pinned in
# backend/constraints.txt. This workflow installs the newest versions the
# requirements allow and runs the same checks, so an upstream change (like
# FastAPI 0.142 no longer flattening included routers) shows up here as a
# warning before anyone has to upgrade the pins. It never gates a merge.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  latest:
    name: Python checks on latest dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auri
          POSTGRES_PASSWORD: auri
          POSTGRES_DB: auri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audio tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sox ffmpeg

      - name: Install the newest allowed versions (no constraints file)
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx aiosqlite
          pip install --upgrade -r backend/requirements.txt -r bot/requirements.txt
          pip freeze > latest-freeze.txt

      - name: Mypy type check
        run: mypy backend/ bot/ --ignore-missing-imports

      - name: Run Python tests
        run: pytest backend/ bot/ -q -m "not live_llm"
        env:
          DATABASE_URL: postgresql+asyncpg://auri:auri@localhost:5432/auri_test
          ENVIRONMENT: test

      - name: Keep the resolved versions for comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latest-freeze
          path: latest-freeze.txt
