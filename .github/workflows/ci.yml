name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"
  # Node comes from .nvmrc (one place for CI, contributors and the README).

jobs:
  # ---------------------------------------------------------------------------
  # Lint — code quality & type checking
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The test tools are installed here too so mypy sees the same types
          # (pytest.skip's NoReturn, fixtures) a contributor's machine does.
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx aiosqlite -c backend/constraints.txt
          pip install -r backend/requirements.txt -r bot/requirements.txt -c backend/constraints.txt

      - name: Ruff lint
        run: ruff check backend/ bot/

      - name: Ruff format check
        run: ruff format --check backend/ bot/

      - name: Mypy type check
        run: mypy backend/ bot/ --ignore-missing-imports

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Node dependencies
        working-directory: mobile
        run: npm ci

      - name: ESLint
        working-directory: mobile
        run: npx eslint . --ext .ts,.tsx

      - name: TypeScript type check
        working-directory: mobile
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Test — unit & integration
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auri
          POSTGRES_PASSWORD: auri
          POSTGRES_DB: auri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install audio tooling
        # voice_mod.py shells out to these, and the mask chains are only
        # really validated by running them. Without sox installed those
        # tests skip, which is how a mask that SoX always rejected shipped
        # from the initial scaffold unnoticed.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sox ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite -c backend/constraints.txt
          pip install -r backend/requirements.txt -r bot/requirements.txt -c backend/constraints.txt

      - name: Apply, reverse and re-apply the migrations on Postgres
        # Tests build tables with create_all on SQLite, so nothing else here ever
        # runs a migration; a migration that failed on every fresh Postgres once
        # shipped that way (plan task 4.5).
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://auri:auri@localhost:5432/auri_test

      - name: Run Python tests
        run: pytest backend/ bot/ -v -m "not live_llm" --cov=backend --cov=bot --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://auri:auri@localhost:5432/auri_test
          ENVIRONMENT: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Node dependencies
        working-directory: mobile
        run: npm ci

      - name: Run vitest
        working-directory: mobile
        # --coverage needs @vitest/coverage-v8; add it back when mobile tests exist.
        run: npx vitest run --passWithNoTests

  # ---------------------------------------------------------------------------
  # Dashboard — HR/admin web app: types, lint, tests, production build
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Build — Docker image build verification
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

  # ---------------------------------------------------------------------------
  # Security — vulnerability scanning
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results to GitHub Security
        # Code-scanning API is unavailable on private repos without Advanced
        # Security; the scan itself (previous step) remains the gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"
